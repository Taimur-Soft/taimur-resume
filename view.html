<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Taimur Rahman Builder</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body { background: var(--preview-bg); }
    .view-navbar {
      background: var(--chrome-bg); padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .view-brand { display: flex; align-items: center; gap: 8px; color: var(--chrome-text); font-weight: 700; font-size: 15px; text-decoration: none; }
    .view-brand-logo {
      width: 28px; height: 28px; border-radius: 7px; background: var(--gold); color: var(--on-gold);
      font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .view-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .view-btn {
      padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; border: none; text-decoration: none;
    }
    .view-btn-primary { background: var(--gold); color: var(--on-gold); }
    .view-btn-primary:hover { background: var(--gold-hover); }
    .view-btn-outline { background: transparent; color: var(--chrome-text); border: 1.5px solid rgba(255,255,255,0.3); }
    .view-btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .view-container { max-width: 700px; margin: 40px auto; padding: 0 20px 60px; }
    .view-error {
      text-align: center; padding: 80px 20px; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    }
    .view-error i { font-size: 48px; color: var(--border); margin-bottom: 16px; display: block; }
    .view-error h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
    .view-error a { color: var(--primary); font-weight: 600; }
    @media print { .view-navbar { display: none; } .view-container { margin: 0; padding: 0; } }
  </style>
</head>
<body>

  <nav class="view-navbar">
    <a href="index.html" class="view-brand"><span class="view-brand-logo">TR</span> Resume Builder</a>
    <div class="view-actions">
      <button type="button" class="theme-toggle theme-toggle-on-dark" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode"><i class="fas fa-moon"></i></button>
      <button class="view-btn view-btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
      <button class="view-btn view-btn-outline" onclick="exportPDF()" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> Download PDF</button>
      <a href="resume.html" class="view-btn view-btn-primary"><i class="fas fa-edit"></i> Build Yours</a>
    </div>
  </nav>

  <div class="view-container">
    <div id="viewContent">
      <div class="view-error">
        <i class="fas fa-spinner fa-spin"></i>
        <h2>Loading resume...</h2>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/resume-export.js"></script>
  <script src="assets/js/pdf-export.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script>
    function showViewMessage(icon, title, text) {
      document.getElementById('viewContent').innerHTML = `
        <div class="view-error">
          <i class="fas ${icon}"></i>
          <h2>${title}</h2>
          <p>${text}<br>
          <a href="resume.html">Create your own resume →</a></p>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const code = new URLSearchParams(window.location.search).get('r');
      const hash = window.location.hash.slice(1);

      // Short link (view.html?r=CODE): the resume's latest version, from
      // the owner's account. See supabase/share.sql.
      if (code) {
        if (!/^[A-Za-z0-9]{8,16}$/.test(code)) {
          showViewMessage('fa-link-slash', 'Link not found', 'This share link isn\'t valid.');
          return;
        }
        try {
          const { data, error } = await supabaseClient.rpc('get_shared_resume', { share_id: code });
          if (error) throw error;
          if (!data) {
            showViewMessage('fa-link-slash', 'This link is no longer active', 'The owner has turned it off, or it doesn\'t exist.');
            return;
          }
          renderViewedResume(data);
        } catch (e) {
          showViewMessage('fa-triangle-exclamation', 'Could not load resume', 'Please check your internet connection and try again.');
        }
        return;
      }

      if (!hash) {
        showViewMessage('fa-exclamation-circle', 'No Resume Found', 'This link doesn\'t contain resume data.');
        return;
      }

      try {
        const json = LZString.decompressFromEncodedURIComponent(hash);
        const data = JSON.parse(json);
        if (!data) throw new Error('Invalid data');
        renderViewedResume(data);
      } catch (e) {
        showViewMessage('fa-exclamation-triangle', 'Could not load resume', 'The link may be invalid or expired.');
      }
    });

    function renderViewedResume(data) {
        // Set up template
        currentTemplate = /^[a-z]+$/.test(data.template || '') ? data.template : 'aurora';

        // Build preview element
        const previewDiv = document.createElement('div');
        previewDiv.id = 'resumePreview';
        previewDiv.className = `resume-preview template-${currentTemplate}`;
        previewDiv.style.cssText = `max-width: 680px; margin: 0 auto; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-radius: 4px;`;
        previewDiv.innerHTML = buildResumeHTML(data);

        document.getElementById('viewContent').innerHTML = '';
        document.getElementById('viewContent').appendChild(previewDiv);
        window.__viewedResumeData = data; // used by pdf-export.js for the filename

        // Update page title
        const name = [data.personal?.firstname, data.personal?.lastname].filter(Boolean).join(' ');
        if (name) document.title = `${name} — Resume`;
    }
  </script>

</body>
</html>
